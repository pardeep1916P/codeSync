name: Build, Release and Deploy Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - '.github/workflows/release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --run

      - name: Build Extension
        run: npm run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_CLIENT_SECRET: ${{ secrets.VITE_GITHUB_CLIENT_SECRET }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Get version from manifest
        id: version
        run: echo "version=$(node -p "require('./public/manifest.json').version")" >> $GITHUB_OUTPUT

      - name: Archive Production Artifacts
        run: |
          cd dist
          zip -r ../codesync-extension.zip .
          cd ..
          cp codesync-extension.zip dist.zip

      - name: Upload & Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx chrome-webstore-upload-cli@3.5.0 upload --source "codesync-extension.zip"
          npx chrome-webstore-upload-cli@3.5.0 publish

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codesync-extension.zip
            dist.zip
          name: "CodeSync v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

