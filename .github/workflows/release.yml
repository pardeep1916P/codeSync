name: Build and Release Extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.skills/**'
      - 'context/**'
      - 'README.md'
      - 'document.md'
      - 'LICENSE'
      - 'public/showcase.png'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --run

      - name: Build Extension
        run: npm run build
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.VITE_GITHUB_CLIENT_ID }}
          VITE_GITHUB_CLIENT_SECRET: ${{ secrets.VITE_GITHUB_CLIENT_SECRET }}

      - name: Archive Production Artifacts
        run: |
          cd dist
          zip -r ../codesync-extension.zip .
          cd ..

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "codesync-extension.zip"
          body: "Automated production build generated by GitHub Actions CI/CD."
          name: "CodeSync Production Release"
          tag: "v1.0.0"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true

      - name: Publish to Chrome Web Store
        if: ${{ secrets.CHROME_CLIENT_ID != '' }}
        continue-on-error: true
        uses: mnao305/chrome-webstore-upload-action@v2
        with:
          file-path: 'codesync-extension.zip'
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

