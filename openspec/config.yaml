schema: spec-driven

# Project context
context: |
  Project: CodeSync Browser Extension
  Tech Stack: TypeScript, React (Vite), Zustand, Vitest, ESLint, Chrome Extension Manifest V3 (MV3).
  Architecture: Main-World Interceptor -> Content Script Bridge -> Service Worker Background Queue -> GitHub Git Trees REST API.
  Conventions:
    - Conventional commits (feat, fix, docs, perf, ci, test, refactor).
    - Modular architecture with clean contracts and non-blocking background queue tasks.
    - Zero console noise in production and 100% test coverage for parsers & queue logic.
    - Spec-driven changes managed via OpenSpec proposals and specifications.

